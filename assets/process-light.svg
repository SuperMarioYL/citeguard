<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 670" data-palette="a3e656-6ae76a-eef6ac-5ec4b0edb8b3" role="img" aria-labelledby="title desc"><title id="title">CiteGuard offline extraction result</title><desc id="desc">The recorded Markdown example has seven lines and yields five unique identifiers: DOI, arXiv, CVE, commit and GitHub issue. The repeated arXiv identifier is deduplicated. Full identifiers and source line numbers are shown; no registry verification occurred.</desc><defs><radialGradient id="halo"><stop stop-color="#5a7f30" stop-opacity=".28"/><stop offset="1" stop-color="#fcfef9" stop-opacity="0"/></radialGradient><linearGradient id="brand"><stop stop-color="#5a7f30"/><stop offset=".6" stop-color="#3c833c"/><stop offset="1" stop-color="#747754"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e3f7cb" stroke-width=".7" opacity=".55"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.flow{stroke-dasharray:6 14;animation:flow 5s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes scan{0%,100%{opacity:.3}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.drift,.scan{animation:none!important;transform:none!important}.flow{stroke-dasharray:none}.pulse,.scan{opacity:.75}}</style><rect width="920" height="670" rx="16" fill="#fcfef9"/><rect x="1" y="1" width="918" height="668" rx="15" fill="url(#grid)" stroke="#e3f7cb"/><text x="40" y="51" font-size="31" fill="#1e2a1c" font-weight="400" text-anchor="start">EXTRACT. NORMALIZE. LOCATE.</text><text x="40" y="90" font-size="22" fill="#64796a" font-weight="400" text-anchor="start">Offline demo · no registry lookup</text><rect x="40" y="136" width="277" height="463" rx="12" fill="#f9fdf3" stroke="#5a7f30"/><text x="61" y="180" font-size="27" fill="#1e2a1c" font-weight="600" text-anchor="start">7 source lines</text><text x="61" y="230" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">DOI</text><text x="61" y="276" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">arXiv v2</text><text x="61" y="322" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">CVE</text><text x="61" y="368" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">Anchored commit SHA</text><text x="61" y="414" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">GitHub issue URL</text><text x="61" y="460" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">Repeated arXiv</text><text x="61" y="563" font-size="18" fill="#5a7f30" font-weight="400" text-anchor="start">Repeat → one identifier</text><path d="M318 365H367" fill="none" stroke="#5a7f30" stroke-width="1.3" opacity=".4"/><path d="M318 365H367" fill="none" stroke="#5a7f30" stroke-width="2.5" class="flow"/><text x="374" y="167" font-size="27" fill="#5a7f30" font-weight="600" text-anchor="start">5 unique Citation objects</text><rect x="372" y="194" width="508" height="64" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="390" y="219" font-size="18" fill="#64796a" font-weight="500" text-anchor="start">doi  ·  line 2</text><text x="390" y="244" font-size="20" fill="#1e2a1c" font-weight="400" text-anchor="start">10.1145/3460120</text><rect x="372" y="269" width="508" height="64" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="390" y="294" font-size="18" fill="#64796a" font-weight="500" text-anchor="start">arxiv  ·  line 3</text><text x="390" y="319" font-size="20" fill="#1e2a1c" font-weight="400" text-anchor="start">1706.03762</text><rect x="372" y="344" width="508" height="64" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="390" y="369" font-size="18" fill="#64796a" font-weight="500" text-anchor="start">cve  ·  line 4</text><text x="390" y="394" font-size="20" fill="#1e2a1c" font-weight="400" text-anchor="start">CVE-2024-3094</text><rect x="372" y="419" width="508" height="86" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="390" y="444" font-size="18" fill="#64796a" font-weight="500" text-anchor="start">commit  ·  line 5</text><text x="390" y="469" font-size="20" fill="#1e2a1c" font-weight="400" text-anchor="start">0123456789abcdef0123</text><text x="390" y="491" font-size="20" fill="#1e2a1c" font-weight="400" text-anchor="start">456789abcdef01234567</text><rect x="372" y="516" width="508" height="64" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="390" y="541" font-size="18" fill="#64796a" font-weight="500" text-anchor="start">gh_issue  ·  line 6</text><text x="390" y="566" font-size="20" fill="#1e2a1c" font-weight="400" text-anchor="start">example/project#42</text><text x="40" y="640" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">Identifiers were extracted. Their existence has not been checked.</text></svg>
