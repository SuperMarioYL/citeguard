<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 954" data-palette="a3e656-6ae76a-eef6ac-5ec4b0edb8b3" role="img" aria-labelledby="title desc"><title id="title">CiteGuard offline extraction result</title><desc id="desc">The recorded Markdown example has seven lines and yields five unique identifiers: DOI, arXiv, CVE, commit and GitHub issue. The repeated arXiv identifier is deduplicated. Full identifiers and source line numbers are shown; no registry verification occurred.</desc><defs><radialGradient id="halo"><stop stop-color="#5a7f30" stop-opacity=".28"/><stop offset="1" stop-color="#fcfef9" stop-opacity="0"/></radialGradient><linearGradient id="brand"><stop stop-color="#5a7f30"/><stop offset=".6" stop-color="#3c833c"/><stop offset="1" stop-color="#747754"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e3f7cb" stroke-width=".7" opacity=".55"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.flow{stroke-dasharray:6 14;animation:flow 5s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes scan{0%,100%{opacity:.3}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.drift,.scan{animation:none!important;transform:none!important}.flow{stroke-dasharray:none}.pulse,.scan{opacity:.75}}</style><rect width="400" height="954" rx="16" fill="#fcfef9"/><rect x="1" y="1" width="398" height="952" rx="15" fill="url(#grid)" stroke="#e3f7cb"/><text x="24" y="40" font-size="25" fill="#1e2a1c" font-weight="400" text-anchor="start">EXTRACT. NORMALIZE.</text><text x="24" y="73" font-size="25" fill="#1e2a1c" font-weight="400" text-anchor="start">LOCATE.</text><text x="24" y="112" font-size="18" fill="#64796a" font-weight="400" text-anchor="start">Offline demo · no registry lookup</text><rect x="24" y="143" width="352" height="163" rx="12" fill="#f9fdf3" stroke="#5a7f30"/><text x="43" y="181" font-size="25" fill="#1e2a1c" font-weight="600" text-anchor="start">7 lines of source text</text><text x="43" y="219" font-size="18" fill="#64796a" font-weight="400" text-anchor="start">Five identifier kinds</text><text x="43" y="247" font-size="18" fill="#64796a" font-weight="400" text-anchor="start">Repeated arXiv → one identifier</text><text x="43" y="275" font-size="18" fill="#64796a" font-weight="400" text-anchor="start">Context spans retain source lines</text><path d="M200 307V351" fill="none" stroke="#5a7f30" stroke-width="1.3" opacity=".4"/><path d="M200 307V351" fill="none" stroke="#5a7f30" stroke-width="2.5" class="flow"/><text x="24" y="386" font-size="25" fill="#5a7f30" font-weight="600" text-anchor="start">5 unique Citation objects</text><rect x="24" y="413" width="352" height="78" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="43" y="442" font-size="19" fill="#64796a" font-weight="500" text-anchor="start">doi  ·  line 2</text><text x="43" y="473" font-size="19" fill="#1e2a1c" font-weight="400" text-anchor="start">10.1145/3460120</text><rect x="24" y="505" width="352" height="78" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="43" y="534" font-size="19" fill="#64796a" font-weight="500" text-anchor="start">arxiv  ·  line 3</text><text x="43" y="565" font-size="19" fill="#1e2a1c" font-weight="400" text-anchor="start">1706.03762</text><rect x="24" y="597" width="352" height="78" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="43" y="626" font-size="19" fill="#64796a" font-weight="500" text-anchor="start">cve  ·  line 4</text><text x="43" y="657" font-size="19" fill="#1e2a1c" font-weight="400" text-anchor="start">CVE-2024-3094</text><rect x="24" y="689" width="352" height="104" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="43" y="718" font-size="19" fill="#64796a" font-weight="500" text-anchor="start">commit  ·  line 5</text><text x="43" y="749" font-size="19" fill="#1e2a1c" font-weight="400" text-anchor="start">0123456789abcdef0123</text><text x="43" y="775" font-size="19" fill="#1e2a1c" font-weight="400" text-anchor="start">456789abcdef01234567</text><rect x="24" y="807" width="352" height="78" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="43" y="836" font-size="19" fill="#64796a" font-weight="500" text-anchor="start">gh_issue  ·  line 6</text><text x="43" y="867" font-size="19" fill="#1e2a1c" font-weight="400" text-anchor="start">example/project#42</text><text x="24" y="924" font-size="18" fill="#64796a" font-weight="400" text-anchor="start">Existence has not been checked.</text></svg>
