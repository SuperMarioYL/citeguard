<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="CiteGuard architecture: input documents flow into a no-LLM extraction layer, then fan out across five registry resolvers (OpenAlex, Crossref, arXiv, NVD, GitHub) backed by a 7-day SQLite cache, and converge on a red/green report layer that emits a terminal table plus a JSON sidecar">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- pipeline frame: deterministic, no-LLM -->
  <rect x="24" y="28" width="832" height="308" rx="18" fill="none" stroke="#E5484D" stroke-opacity="0.40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="50" font-size="13" font-weight="600" fill="#B42318">Deterministic pipeline — no LLM · precision over recall</text>

  <!-- connectors -->
  <g stroke="#C9C9D0" stroke-width="1.6" fill="none">
    <line x1="204" y1="196" x2="252" y2="196" marker-end="url(#ah-l)"/>
    <line x1="420" y1="196" x2="468" y2="196" marker-end="url(#ah-l)"/>
    <line x1="660" y1="196" x2="708" y2="196" marker-end="url(#ah-l)"/>
    <!-- cache link from resolver core -->
    <line x1="564" y1="276" x2="564" y2="308" marker-end="url(#ah-l)"/>
  </g>

  <!-- Input -->
  <g>
    <rect x="40" y="120" width="164" height="152" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="122" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">Input</text>
    <g font-size="11.5" fill="#0A4F9E">
      <rect x="58" y="162" width="128" height="26" rx="8" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.1"/>
      <text x="122" y="179" text-anchor="middle">PDF · .tex</text>
      <rect x="58" y="194" width="128" height="26" rx="8" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.1"/>
      <text x="122" y="211" text-anchor="middle">Markdown</text>
      <rect x="58" y="226" width="128" height="26" rx="8" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.1"/>
      <text x="122" y="243" text-anchor="middle">plain text</text>
    </g>
  </g>

  <!-- Extraction -->
  <g>
    <rect x="252" y="120" width="168" height="152" rx="15" fill="#F2B705" fill-opacity="0.12" stroke="#F2B705" stroke-width="1.6"/>
    <text x="336" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#9A7400">Extraction</text>
    <g font-size="11.5" fill="#7A5C00">
      <text x="336" y="174" text-anchor="middle">pypdf text layer</text>
      <text x="336" y="194" text-anchor="middle">5 identifier regexes</text>
      <text x="336" y="222" text-anchor="middle" font-weight="600" fill="#9A7400">DOI · arXiv · CVE</text>
      <text x="336" y="240" text-anchor="middle" font-weight="600" fill="#9A7400">commit · gh#issue</text>
    </g>
  </g>

  <!-- Resolver fan-out -->
  <g>
    <rect x="468" y="120" width="192" height="152" rx="15" fill="#E5484D" fill-opacity="0.10" stroke="#E5484D" stroke-width="1.6"/>
    <text x="564" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#B42318">Resolver fan-out</text>
    <text x="564" y="164" text-anchor="middle" font-size="10.5" fill="#B42318">asyncio.gather · httpx · tenacity</text>
    <g font-size="10.5" fill="#B42318" font-weight="600">
      <rect x="484" y="174" width="76" height="24" rx="7" fill="#E5484D" fill-opacity="0.14" stroke="#E5484D" stroke-width="1.1"/>
      <text x="522" y="190" text-anchor="middle">OpenAlex</text>
      <rect x="568" y="174" width="76" height="24" rx="7" fill="#E5484D" fill-opacity="0.14" stroke="#E5484D" stroke-width="1.1"/>
      <text x="606" y="190" text-anchor="middle">Crossref</text>
      <rect x="484" y="204" width="76" height="24" rx="7" fill="#E5484D" fill-opacity="0.14" stroke="#E5484D" stroke-width="1.1"/>
      <text x="522" y="220" text-anchor="middle">arXiv</text>
      <rect x="568" y="204" width="76" height="24" rx="7" fill="#E5484D" fill-opacity="0.14" stroke="#E5484D" stroke-width="1.1"/>
      <text x="606" y="220" text-anchor="middle">NVD</text>
      <rect x="526" y="234" width="76" height="24" rx="7" fill="#E5484D" fill-opacity="0.14" stroke="#E5484D" stroke-width="1.1"/>
      <text x="564" y="250" text-anchor="middle">GitHub</text>
    </g>
  </g>

  <!-- Report -->
  <g>
    <rect x="708" y="120" width="148" height="152" rx="15" fill="#10A37F" fill-opacity="0.09" stroke="#10A37F" stroke-width="1.5"/>
    <text x="782" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Report</text>
    <g font-size="11.5" fill="#0B6B53">
      <rect x="724" y="162" width="116" height="44" rx="9" fill="#10A37F" fill-opacity="0.12" stroke="#10A37F" stroke-width="1.1"/>
      <text x="782" y="180" text-anchor="middle" font-weight="600">rich table</text>
      <text x="782" y="197" text-anchor="middle" font-size="10.5">✓ green · ✗ red · ? amber</text>
      <rect x="724" y="214" width="116" height="42" rx="9" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.1"/>
      <text x="782" y="232" text-anchor="middle" font-weight="600">JSON sidecar</text>
      <text x="782" y="249" text-anchor="middle" font-size="10.5">+ optional .md</text>
    </g>
  </g>

  <!-- SQLite cache -->
  <g>
    <rect x="468" y="308" width="192" height="40" rx="12" fill="#6E6E73" fill-opacity="0.10" stroke="#6E6E73" stroke-width="1.4"/>
    <text x="564" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#4A4A50">SQLite cache · 7-day TTL · degraded not cached</text>
  </g>
</svg>
