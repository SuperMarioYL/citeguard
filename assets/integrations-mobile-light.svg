<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 954" data-palette="a3e656-6ae76a-eef6ac-5ec4b0edb8b3" role="img" aria-labelledby="title desc"><title id="title">CiteGuard integrations</title><desc id="desc">DOI lookups use OpenAlex and Crossref fallback, arXiv uses arXiv, CVE uses NVD, and commits or issues use GitHub. Documents are text-layer PDF, TeX, Markdown or plain text. Outputs include JSON, Markdown and a GitHub Action. These are implemented routes, not live connection status.</desc><defs><radialGradient id="halo"><stop stop-color="#5a7f30" stop-opacity=".28"/><stop offset="1" stop-color="#fcfef9" stop-opacity="0"/></radialGradient><linearGradient id="brand"><stop stop-color="#5a7f30"/><stop offset=".6" stop-color="#3c833c"/><stop offset="1" stop-color="#747754"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e3f7cb" stroke-width=".7" opacity=".55"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.flow{stroke-dasharray:6 14;animation:flow 5s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes scan{0%,100%{opacity:.3}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.drift,.scan{animation:none!important;transform:none!important}.flow{stroke-dasharray:none}.pulse,.scan{opacity:.75}}</style><rect width="400" height="954" rx="16" fill="#fcfef9"/><rect x="1" y="1" width="398" height="952" rx="15" fill="url(#grid)" stroke="#e3f7cb"/><text x="24" y="40" font-size="24" fill="#1e2a1c" font-weight="400" text-anchor="start">FIVE KINDS.</text><text x="24" y="73" font-size="24" fill="#1e2a1c" font-weight="400" text-anchor="start">REGISTRY-SPECIFIC ROUTES.</text><text x="24" y="108" font-size="17" fill="#64796a" font-weight="400" text-anchor="start">Implemented lookup and report paths</text><ellipse cx="200" cy="489" rx="127" ry="284" fill="none" stroke="#e3f7cb"/><circle cx="200" cy="489" r="100.8" fill="url(#halo)"/><path d="M159.68 448.68L200 433L240.32 448.68V495.72Q234.72 527.08 200 545Q165.28 527.08 159.68 495.72Z" fill="none" stroke="#5a7f30" stroke-width="8" opacity=".27" filter="url(#glow)"/><path d="M159.68 448.68L200 433L240.32 448.68V495.72Q234.72 527.08 200 545Q165.28 527.08 159.68 495.72Z" fill="#fafef7" stroke="url(#brand)" stroke-width="2"/><path d="M190.48 469.4H179.84V506.92H190.48M209.52 469.4H220.16V506.92H209.52" fill="none" stroke="#747754" stroke-width="4" /><circle cx="200" cy="489" r="4" fill="#3c833c" class="pulse"/><path d="M200.0 418.0L200 192" fill="none" stroke="#5a7f30" stroke-width="1.3" opacity=".4"/><path d="M200.0 418.0L200 192" fill="none" stroke="#5a7f30" stroke-width="2.5" class="flow"/><rect x="88.0" y="141.0" width="224" height="102" rx="12" fill="#fafef7" stroke="#5a7f30"/><text x="200" y="173.0" font-size="21" fill="#1e2a1c" font-weight="600" text-anchor="middle">DOI</text><text x="200" y="202.0" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">OpenAlex</text><text x="200" y="226.0" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">Crossref fallback</text><path d="M236.9 428.3L290 341" fill="none" stroke="#3c833c" stroke-width="1.3" opacity=".4"/><path d="M236.9 428.3L290 341" fill="none" stroke="#3c833c" stroke-width="2.5" class="flow"/><rect x="208.0" y="299.5" width="164" height="83" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="290" y="331.5" font-size="21" fill="#1e2a1c" font-weight="600" text-anchor="middle">arXiv</text><text x="290" y="360.5" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">arXiv API</text><path d="M233.8 551.4L290 655" fill="none" stroke="#5a7f30" stroke-width="1.3" opacity=".4"/><path d="M233.8 551.4L290 655" fill="none" stroke="#5a7f30" stroke-width="2.5" class="flow"/><rect x="208.0" y="613.5" width="164" height="83" rx="12" fill="#fafef7" stroke="#5a7f30"/><text x="290" y="645.5" font-size="21" fill="#1e2a1c" font-weight="600" text-anchor="middle">CVE</text><text x="290" y="674.5" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">NVD</text><path d="M200.0 560.0L200 811" fill="none" stroke="#3c833c" stroke-width="1.3" opacity=".4"/><path d="M200.0 560.0L200 811" fill="none" stroke="#3c833c" stroke-width="2.5" class="flow"/><rect x="88.0" y="769.5" width="224" height="83" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="200" y="801.5" font-size="21" fill="#1e2a1c" font-weight="600" text-anchor="middle">Commit / issue</text><text x="200" y="830.5" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">GitHub</text><path d="M166.2 551.4L110 655" fill="none" stroke="#5a7f30" stroke-width="1.3" opacity=".4"/><path d="M166.2 551.4L110 655" fill="none" stroke="#5a7f30" stroke-width="2.5" class="flow"/><rect x="28.0" y="604.0" width="164" height="102" rx="12" fill="#fafef7" stroke="#5a7f30"/><text x="110" y="636.0" font-size="21" fill="#1e2a1c" font-weight="600" text-anchor="middle">Documents</text><text x="110" y="665.0" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">PDF · TeX · MD</text><text x="110" y="689.0" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">plain text</text><path d="M163.1 428.3L110 341" fill="none" stroke="#3c833c" stroke-width="1.3" opacity=".4"/><path d="M163.1 428.3L110 341" fill="none" stroke="#3c833c" stroke-width="2.5" class="flow"/><rect x="28.0" y="290.0" width="164" height="102" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="110" y="322.0" font-size="21" fill="#1e2a1c" font-weight="600" text-anchor="middle">Reports / CI</text><text x="110" y="351.0" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">JSON · Markdown</text><text x="110" y="375.0" font-size="17" fill="#64796a" font-weight="400" text-anchor="middle">GitHub Action</text><text x="24" y="908" font-size="18" fill="#64796a" font-weight="400" text-anchor="start">Verification requires network access.</text></svg>
