<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 676" data-palette="a3e656-6ae76a-eef6ac-5ec4b0edb8b3" role="img" aria-labelledby="title desc"><title id="title">CiteGuard integrations</title><desc id="desc">DOI lookups use OpenAlex and Crossref fallback, arXiv uses arXiv, CVE uses NVD, and commits or issues use GitHub. Documents are text-layer PDF, TeX, Markdown or plain text. Outputs include JSON, Markdown and a GitHub Action. These are implemented routes, not live connection status.</desc><defs><radialGradient id="halo"><stop stop-color="#5a7f30" stop-opacity=".28"/><stop offset="1" stop-color="#fcfef9" stop-opacity="0"/></radialGradient><linearGradient id="brand"><stop stop-color="#5a7f30"/><stop offset=".6" stop-color="#3c833c"/><stop offset="1" stop-color="#747754"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e3f7cb" stroke-width=".7" opacity=".55"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.flow{stroke-dasharray:6 14;animation:flow 5s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes scan{0%,100%{opacity:.3}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.drift,.scan{animation:none!important;transform:none!important}.flow{stroke-dasharray:none}.pulse,.scan{opacity:.75}}</style><rect width="920" height="676" rx="16" fill="#fcfef9"/><rect x="1" y="1" width="918" height="674" rx="15" fill="url(#grid)" stroke="#e3f7cb"/><text x="40" y="52" font-size="29" fill="#1e2a1c" font-weight="600" text-anchor="start">FIVE KINDS. REGISTRY-SPECIFIC ROUTES.</text><text x="40" y="90" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">Implemented lookup and report paths</text><ellipse cx="460" cy="367" rx="286" ry="195" fill="none" stroke="#e3f7cb"/><circle cx="460" cy="367" r="117.0" fill="url(#halo)"/><path d="M413.2 320.2L460 302L506.8 320.2V374.8Q500.3 411.2 460 432Q419.7 411.2 413.2 374.8Z" fill="none" stroke="#5a7f30" stroke-width="8" opacity=".27" filter="url(#glow)"/><path d="M413.2 320.2L460 302L506.8 320.2V374.8Q500.3 411.2 460 432Q419.7 411.2 413.2 374.8Z" fill="#fafef7" stroke="url(#brand)" stroke-width="2"/><path d="M448.95 344.25H436.6V387.8H448.95M471.05 344.25H483.4V387.8H471.05" fill="none" stroke="#747754" stroke-width="4" /><circle cx="460" cy="367" r="4" fill="#3c833c" class="pulse"/><path d="M460.0 296.0L460 167" fill="none" stroke="#5a7f30" stroke-width="1.3" opacity=".4"/><path d="M460.0 296.0L460 167" fill="none" stroke="#5a7f30" stroke-width="2.5" class="flow"/><rect x="305.0" y="125.5" width="310" height="83" rx="12" fill="#fafef7" stroke="#5a7f30"/><text x="460" y="157.5" font-size="25" fill="#1e2a1c" font-weight="600" text-anchor="middle">DOI</text><text x="460" y="186.5" font-size="18" fill="#64796a" font-weight="400" text-anchor="middle">OpenAlex → Crossref fallback</text><path d="M526.0 340.8L744 254" fill="none" stroke="#3c833c" stroke-width="1.3" opacity=".4"/><path d="M526.0 340.8L744 254" fill="none" stroke="#3c833c" stroke-width="2.5" class="flow"/><rect x="626.0" y="212.5" width="236" height="83" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="744" y="244.5" font-size="25" fill="#1e2a1c" font-weight="600" text-anchor="middle">arXiv</text><text x="744" y="273.5" font-size="18" fill="#64796a" font-weight="400" text-anchor="middle">arXiv API</text><path d="M526.3 392.4L744 476" fill="none" stroke="#5a7f30" stroke-width="1.3" opacity=".4"/><path d="M526.3 392.4L744 476" fill="none" stroke="#5a7f30" stroke-width="2.5" class="flow"/><rect x="626.0" y="434.5" width="236" height="83" rx="12" fill="#fafef7" stroke="#5a7f30"/><text x="744" y="466.5" font-size="25" fill="#1e2a1c" font-weight="600" text-anchor="middle">CVE</text><text x="744" y="495.5" font-size="18" fill="#64796a" font-weight="400" text-anchor="middle">NVD</text><path d="M460.0 438.0L460 569" fill="none" stroke="#3c833c" stroke-width="1.3" opacity=".4"/><path d="M460.0 438.0L460 569" fill="none" stroke="#3c833c" stroke-width="2.5" class="flow"/><rect x="305.0" y="527.5" width="310" height="83" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="460" y="559.5" font-size="25" fill="#1e2a1c" font-weight="600" text-anchor="middle">Commit / issue</text><text x="460" y="588.5" font-size="18" fill="#64796a" font-weight="400" text-anchor="middle">GitHub</text><path d="M393.7 392.4L176 476" fill="none" stroke="#5a7f30" stroke-width="1.3" opacity=".4"/><path d="M393.7 392.4L176 476" fill="none" stroke="#5a7f30" stroke-width="2.5" class="flow"/><rect x="58.0" y="425.0" width="236" height="102" rx="12" fill="#fafef7" stroke="#5a7f30"/><text x="176" y="457.0" font-size="25" fill="#1e2a1c" font-weight="600" text-anchor="middle">Documents</text><text x="176" y="486.0" font-size="18" fill="#64796a" font-weight="400" text-anchor="middle">PDF · TeX · MD</text><text x="176" y="510.0" font-size="18" fill="#64796a" font-weight="400" text-anchor="middle">plain text</text><path d="M394.0 340.8L176 254" fill="none" stroke="#3c833c" stroke-width="1.3" opacity=".4"/><path d="M394.0 340.8L176 254" fill="none" stroke="#3c833c" stroke-width="2.5" class="flow"/><rect x="58.0" y="203.0" width="236" height="102" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="176" y="235.0" font-size="25" fill="#1e2a1c" font-weight="600" text-anchor="middle">Reports / CI</text><text x="176" y="264.0" font-size="18" fill="#64796a" font-weight="400" text-anchor="middle">JSON · Markdown</text><text x="176" y="288.0" font-size="18" fill="#64796a" font-weight="400" text-anchor="middle">GitHub Action</text><text x="40" y="630" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">Verification requires network access.</text></svg>
