<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 710" data-palette="a3e656-6ae76a-eef6ac-5ec4b0edb8b3" role="img" aria-labelledby="title desc"><title id="title">CiteGuard architecture</title><desc id="desc">Document extraction creates Citation objects with source context. Network verification routes DOI to OpenAlex with Crossref fallback on miss, arXiv to arXiv, CVE to NVD and GitHub references to GitHub. Reports use hit, miss and degraded. The SQLite cache has seven-day TTL and does not persist degraded results.</desc><defs><radialGradient id="halo"><stop stop-color="#a3e656" stop-opacity=".28"/><stop offset="1" stop-color="#080c0d" stop-opacity="0"/></radialGradient><linearGradient id="brand"><stop stop-color="#a3e656"/><stop offset=".6" stop-color="#6ae76a"/><stop offset="1" stop-color="#eef6ac"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2a3c1d" stroke-width=".7" opacity=".55"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.flow{stroke-dasharray:6 14;animation:flow 5s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes scan{0%,100%{opacity:.3}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.drift,.scan{animation:none!important;transform:none!important}.flow{stroke-dasharray:none}.pulse,.scan{opacity:.75}}</style><rect width="920" height="710" rx="16" fill="#080c0d"/><rect x="1" y="1" width="918" height="708" rx="15" fill="url(#grid)" stroke="#2a3c1d"/><text x="40" y="51" font-size="32" fill="#fcfdee" font-weight="600" text-anchor="start">FOLLOW THE IDENTIFIER</text><text x="40" y="87" font-size="22" fill="#a5b9a8" font-weight="400" text-anchor="start">Extraction, registry lookup and source context</text><rect x="40" y="125" width="236" height="137" rx="12" fill="#101717" stroke="#a3e656"/><text x="58" y="167" font-size="25" fill="#fcfdee" font-weight="600" text-anchor="start">Document input</text><text x="58" y="207" font-size="19" fill="#a5b9a8" font-weight="400" text-anchor="start">PDF text · TeX</text><text x="58" y="235" font-size="19" fill="#a5b9a8" font-weight="400" text-anchor="start">MD · plain text</text><rect x="342" y="125" width="236" height="137" rx="12" fill="#101717" stroke="#6ae76a"/><text x="360" y="167" font-size="25" fill="#fcfdee" font-weight="600" text-anchor="start">extract.py</text><text x="360" y="207" font-size="19" fill="#a5b9a8" font-weight="400" text-anchor="start">Patterns + normalization</text><text x="360" y="235" font-size="19" fill="#a5b9a8" font-weight="400" text-anchor="start">No model call</text><rect x="644" y="125" width="236" height="137" rx="12" fill="#101717" stroke="#a3e656"/><text x="662" y="167" font-size="25" fill="#fcfdee" font-weight="600" text-anchor="start">Citation</text><text x="662" y="207" font-size="19" fill="#a5b9a8" font-weight="400" text-anchor="start">kind · identifier</text><text x="662" y="235" font-size="19" fill="#a5b9a8" font-weight="400" text-anchor="start">file · offsets · line</text><path d="M277 192H341" fill="none" stroke="#a3e656" stroke-width="1.3" opacity=".4"/><path d="M277 192H341" fill="none" stroke="#a3e656" stroke-width="2.5" class="flow"/><path d="M579 192H643" fill="none" stroke="#a3e656" stroke-width="1.3" opacity=".4"/><path d="M579 192H643" fill="none" stroke="#a3e656" stroke-width="2.5" class="flow"/><text x="40" y="311" font-size="19" fill="#a5b9a8" font-weight="600" text-anchor="start">NETWORK REQUIRED FOR VERIFICATION</text><rect x="40" y="335" width="840" height="168" rx="12" fill="#101717" stroke="#6ae76a"/><text x="65" y="378" font-size="23" fill="#fcfdee" font-weight="400" text-anchor="start">DOI → OpenAlex</text><text x="65" y="414" font-size="23" fill="#fcfdee" font-weight="400" text-anchor="start">OpenAlex miss → Crossref fallback</text><text x="65" y="460" font-size="23" fill="#a3e656" font-weight="400" text-anchor="start">arXiv → arXiv API</text><text x="527" y="378" font-size="23" fill="#fcfdee" font-weight="400" text-anchor="start">CVE → NVD</text><text x="527" y="414" font-size="23" fill="#fcfdee" font-weight="400" text-anchor="start">Commit / issue → GitHub</text><path d="M762 263V335" fill="none" stroke="#6ae76a" stroke-width="1.3" opacity=".4"/><path d="M762 263V335" fill="none" stroke="#6ae76a" stroke-width="2.5" class="flow"/><path d="M460 504V551" fill="none" stroke="#a3e656" stroke-width="1.3" opacity=".4"/><path d="M460 504V551" fill="none" stroke="#a3e656" stroke-width="2.5" class="flow"/><rect x="40" y="552" width="535" height="126" rx="12" fill="#101717" stroke="#a3e656"/><text x="62" y="595" font-size="28" fill="#fcfdee" font-weight="600" text-anchor="start">VerifyResult → report</text><text x="62" y="632" font-size="24" fill="#a3e656" font-weight="400" text-anchor="start">hit · miss · degraded</text><text x="62" y="660" font-size="19" fill="#a5b9a8" font-weight="400" text-anchor="start">Evidence URL · JSON · Markdown</text><rect x="606" y="552" width="274" height="126" rx="12" fill="#0f1713" stroke="#6ae76a"/><text x="626" y="591" font-size="24" fill="#fcfdee" font-weight="600" text-anchor="start">SQLite · 7-day TTL</text><text x="626" y="625" font-size="18" fill="#a5b9a8" font-weight="400" text-anchor="start">degraded is not cached</text><text x="626" y="653" font-size="18" fill="#a5b9a8" font-weight="400" text-anchor="start">Errors → live lookup</text><path d="M743 503V551" fill="none" stroke="#6ae76a" stroke-width="1.3" opacity=".4"/><path d="M743 503V551" fill="none" stroke="#6ae76a" stroke-width="2.5" class="flow"/></svg>
