<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1070" data-palette="a3e656-6ae76a-eef6ac-5ec4b0edb8b3" role="img" aria-labelledby="title desc"><title id="title">CiteGuard architecture</title><desc id="desc">Document extraction creates Citation objects with source context. Network verification routes DOI to OpenAlex with Crossref fallback on miss, arXiv to arXiv, CVE to NVD and GitHub references to GitHub. Reports use hit, miss and degraded. The SQLite cache has seven-day TTL and does not persist degraded results.</desc><defs><radialGradient id="halo"><stop stop-color="#a3e656" stop-opacity=".28"/><stop offset="1" stop-color="#080c0d" stop-opacity="0"/></radialGradient><linearGradient id="brand"><stop stop-color="#a3e656"/><stop offset=".6" stop-color="#6ae76a"/><stop offset="1" stop-color="#eef6ac"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2a3c1d" stroke-width=".7" opacity=".55"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.flow{stroke-dasharray:6 14;animation:flow 5s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes scan{0%,100%{opacity:.3}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.drift,.scan{animation:none!important;transform:none!important}.flow{stroke-dasharray:none}.pulse,.scan{opacity:.75}}</style><rect width="400" height="1070" rx="16" fill="#080c0d"/><rect x="1" y="1" width="398" height="1068" rx="15" fill="url(#grid)" stroke="#2a3c1d"/><text x="24" y="40" font-size="24" fill="#fcfdee" font-weight="400" text-anchor="start">FOLLOW THE IDENTIFIER</text><text x="24" y="76" font-size="17" fill="#a5b9a8" font-weight="400" text-anchor="start">Extraction, lookup, source context</text><rect x="24" y="108" width="352" height="85" rx="12" fill="#101717" stroke="#a3e656"/><text x="200" y="145" font-size="25" fill="#fcfdee" font-weight="600" text-anchor="middle">Document input</text><text x="200" y="176" font-size="18" fill="#a5b9a8" font-weight="400" text-anchor="middle">PDF text · TeX · MD · plain text</text><path d="M200 193V225" fill="none" stroke="#a3e656" stroke-width="1.3" opacity=".4"/><path d="M200 193V225" fill="none" stroke="#a3e656" stroke-width="2.5" class="flow"/><rect x="24" y="226" width="352" height="85" rx="12" fill="#0f1713" stroke="#6ae76a"/><text x="200" y="261" font-size="25" fill="#fcfdee" font-weight="600" text-anchor="middle">extract.py</text><text x="200" y="291" font-size="18" fill="#a5b9a8" font-weight="400" text-anchor="middle">patterns → normalized identifiers</text><path d="M200 311V343" fill="none" stroke="#a3e656" stroke-width="1.3" opacity=".4"/><path d="M200 311V343" fill="none" stroke="#a3e656" stroke-width="2.5" class="flow"/><rect x="24" y="344" width="352" height="91" rx="12" fill="#101717" stroke="#a3e656"/><text x="200" y="380" font-size="27" fill="#fcfdee" font-weight="600" text-anchor="middle">Citation</text><text x="200" y="412" font-size="19" fill="#a3e656" font-weight="400" text-anchor="middle">kind · identifier · source line</text><text x="24" y="469" font-size="17" fill="#a5b9a8" font-weight="600" text-anchor="start">NETWORK REQUIRED BELOW</text><rect x="24" y="489" width="352" height="219" rx="12" fill="#101717" stroke="#6ae76a"/><text x="44" y="528" font-size="20" fill="#fcfdee" font-weight="400" text-anchor="start">DOI → OpenAlex</text><text x="44" y="564" font-size="20" fill="#fcfdee" font-weight="400" text-anchor="start">miss → Crossref fallback</text><text x="44" y="600" font-size="20" fill="#fcfdee" font-weight="400" text-anchor="start">arXiv → arXiv API</text><text x="44" y="636" font-size="20" fill="#fcfdee" font-weight="400" text-anchor="start">CVE → NVD</text><text x="44" y="672" font-size="20" fill="#fcfdee" font-weight="400" text-anchor="start">Commit / issue → GitHub</text><path d="M200 708V742" fill="none" stroke="#6ae76a" stroke-width="1.3" opacity=".4"/><path d="M200 708V742" fill="none" stroke="#6ae76a" stroke-width="2.5" class="flow"/><rect x="24" y="743" width="352" height="129" rx="12" fill="#101717" stroke="#a3e656"/><text x="200" y="777" font-size="24" fill="#fcfdee" font-weight="600" text-anchor="middle">VerifyResult → report</text><text x="200" y="810" font-size="21" fill="#a3e656" font-weight="400" text-anchor="middle">hit · miss · degraded</text><text x="200" y="846" font-size="18" fill="#a5b9a8" font-weight="400" text-anchor="middle">Evidence URL · JSON · Markdown</text><rect x="24" y="904" width="352" height="98" rx="12" fill="#0f1713" stroke="#6ae76a"/><text x="200" y="940" font-size="24" fill="#fcfdee" font-weight="600" text-anchor="middle">SQLite · 7-day TTL</text><text x="200" y="973" font-size="18" fill="#a5b9a8" font-weight="400" text-anchor="middle">degraded results are not cached</text><text x="24" y="1039" font-size="18" fill="#a5b9a8" font-weight="400" text-anchor="start">Cache errors fall back to lookup.</text></svg>
