<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" data-palette="a3e656-6ae76a-eef6ac-5ec4b0edb8b3" role="img" aria-labelledby="title desc"><title id="title">CiteGuard recorded extraction snapshot</title><desc id="desc">A DOI fragment stays DOI; the unanchored hash is not extracted. This image uses the exact identifiers from the corresponding CLI output.</desc><defs><radialGradient id="halo"><stop stop-color="#5a7f30" stop-opacity=".28"/><stop offset="1" stop-color="#fcfef9" stop-opacity="0"/></radialGradient><linearGradient id="brand"><stop stop-color="#5a7f30"/><stop offset=".6" stop-color="#3c833c"/><stop offset="1" stop-color="#747754"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e3f7cb" stroke-width=".7" opacity=".55"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.flow{stroke-dasharray:6 14;animation:flow 5s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slow{animation-delay:-2s}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes scan{0%,100%{opacity:.3}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.drift,.scan{animation:none!important;transform:none!important}.flow{stroke-dasharray:none}.pulse,.scan{opacity:.75}}</style><rect width="920" height="490" rx="16" fill="#fcfef9"/><rect x="1" y="1" width="918" height="488" rx="15" fill="url(#grid)" stroke="#e3f7cb"/><text x="40" y="52" font-size="29" fill="#1e2a1c" font-weight="600" text-anchor="start">OFFLINE EXTRACTION</text><text x="40" y="91" font-size="22" fill="#64796a" font-weight="400" text-anchor="start">extract</text><rect x="40" y="136" width="840" height="98" rx="12" fill="#fafef7" stroke="#5a7f30"/><text x="62" y="171" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">doi  ·  line 1</text><text x="62" y="211" font-size="27" fill="#1e2a1c" font-weight="500" text-anchor="start">10.1145/3460120</text><rect x="40" y="255" width="840" height="98" rx="12" fill="#fafef7" stroke="#3c833c"/><text x="62" y="290" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">gh_issue  ·  line 3</text><text x="62" y="330" font-size="27" fill="#1e2a1c" font-weight="500" text-anchor="start">example/project#42</text><text x="40" y="416" font-size="21" fill="#64796a" font-weight="400" text-anchor="start">A DOI fragment stays DOI; the unanchored hash is not extracted.</text><text x="40" y="456" font-size="21" fill="#5a7f30" font-weight="400" text-anchor="start">No registry lookup. No existence verdict.</text></svg>
