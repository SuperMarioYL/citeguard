name: CiteGuard
description: >-
  Batch-verify every citation, DOI, arXiv ID, CVE, commit SHA, and
  owner/repo#issue reference in a PR against real registries (OpenAlex,
  Crossref, arXiv, NVD, GitHub). Posts a sticky red/green report on the PR.
author: SuperMarioYL

branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: "Pinned citeguard version to install from PyPI (use 'latest' to skip the pin)."
    required: false
    default: "0.6.0"
  fail-on:
    description: "Which outcome trips a failing check: none | miss | degraded."
    required: false
    default: "miss"
  max-misses:
    description: "Tolerate up to N misses before fail-on triggers (>= 0)."
    required: false
    default: "0"
  paths:
    description: "Comma-separated glob filter applied to the PR's changed files."
    required: false
    default: "**/*.pdf,**/*.tex,**/*.md"
  comment:
    description: "Post a sticky PR comment with the red/green report ('true' / 'false')."
    required: false
    default: "true"
  github-token:
    description: "Token used to fetch the PR diff and upsert the sticky comment. Needs pull-requests: write."
    required: false
    default: ${{ github.token }}

outputs:
  hit:
    description: "Number of citations that resolved successfully."
    value: ${{ steps.run.outputs.hit }}
  miss:
    description: "Number of citations the registries could not find."
    value: ${{ steps.run.outputs.miss }}
  degraded:
    description: "Number of citations the registries did not return a verdict on."
    value: ${{ steps.run.outputs.degraded }}
  failed:
    description: "'true' iff the fail-on threshold was crossed (check fails)."
    value: ${{ steps.run.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install citeguard
      shell: bash
      run: |
        python -m pip install --upgrade pip pipx
        if [ "${{ inputs.version }}" = "latest" ]; then
          pipx install citeguard
        else
          pipx install "citeguard==${{ inputs.version }}"
        fi

    - name: Compute changed files
      id: diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        OUT="${RUNNER_TEMP}/citeguard-changed.txt"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          gh pr diff "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --name-only > "$OUT"
        else
          # push event — diff against the previous commit
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$OUT" || true
        fi
        echo "list=$OUT" >> "$GITHUB_OUTPUT"
        echo "----- changed files -----"
        cat "$OUT" || true
        echo "-------------------------"

    - name: Run citeguard
      id: run
      shell: bash
      run: |
        set -euo pipefail
        citeguard \
          --changed-only "${{ steps.diff.outputs.list }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --max-misses "${{ inputs.max-misses }}" \
          --paths "${{ inputs.paths }}" \
          --summary-out "${GITHUB_STEP_SUMMARY}" \
          --annotations \
          || echo "citeguard exit code: $?"
        # citeguard already wrote hit/miss/degraded/failed to $GITHUB_OUTPUT.

    - name: Upsert sticky PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        SUMMARY_FILE="${GITHUB_STEP_SUMMARY}"
        if [ ! -s "$SUMMARY_FILE" ]; then
          echo "no summary written; nothing to post"
          exit 0
        fi
        BODY_FILE="${RUNNER_TEMP}/citeguard-body.md"
        cp "$SUMMARY_FILE" "$BODY_FILE"
        REPO="${{ github.repository }}"
        PR="${{ github.event.pull_request.number }}"
        MARKER="<!-- citeguard:sticky -->"
        EXISTING=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
                   --jq "[.[] | select(.body | contains(\"${MARKER}\"))][0].id" || echo "")
        if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${EXISTING}" \
              -f body="$(cat "$BODY_FILE")" >/dev/null
          echo "updated sticky comment ${EXISTING}"
        else
          gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
              -f body="$(cat "$BODY_FILE")" >/dev/null
          echo "posted new sticky comment"
        fi

    - name: Enforce fail-on threshold
      shell: bash
      run: |
        if [ "${{ steps.run.outputs.failed }}" = "true" ]; then
          echo "::error::CiteGuard threshold exceeded (fail-on=${{ inputs.fail-on }}, max-misses=${{ inputs.max-misses }})"
          exit 1
        fi
