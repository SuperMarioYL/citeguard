[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "citeguard"
version = "0.4.0"
description = "Batch-verify every citation, DOI, arXiv ID, CVE, and commit SHA in a paper or bug report against real registries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "supermario_leo" }]
keywords = [
  "citation",
  "doi",
  "arxiv",
  "cve",
  "bibliography",
  "peer-review",
  "verification",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pypdf>=4.2",
  "httpx>=0.27",
  "pydantic>=2.6",
  "rich>=13.7",
  "click>=8.1",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
citeguard = "citeguard.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/citeguard"
Repository = "https://github.com/SuperMarioYL/citeguard"
Issues = "https://github.com/SuperMarioYL/citeguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/citeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
