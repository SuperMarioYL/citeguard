name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests

      - name: Test
        run: |
          pytest -q

  pin-actions-versions:
    # Grep guard (v0.3 m6_preflight_lint; v0.4 extension): fails the build if
    # ANY committed file — including every workflow under .github/workflows/
    # (ci.yml, demo.yml, release.yml, …) — still pins actions/checkout to a
    # pre-Node.js-24 major (v1..v4) or actions/setup-python to a pre-Node.js-24
    # major (v1..v5).  `.example` files are excluded so we can keep a documented
    # stale fixture in-tree without tripping the guard.  ci.yml is no longer
    # exempt: the pattern only matches a literal `@vN` pin, not the regex string
    # documented in this step, so the guard now covers its own workflow file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Grep for stale Action major versions
        run: |
          set -euo pipefail
          PATTERN='actions/(checkout@v[1-4]|setup-python@v[1-5])([^0-9]|$)'
          # `:!*.example` excludes documentation fixtures from the scan.
          if git grep -nE "$PATTERN" -- \
               ':!*.example' \
               > /tmp/stale_actions.txt; then
            echo "::error::Stale GitHub Action versions detected:"
            cat /tmp/stale_actions.txt
            echo
            echo "Bump checkout to @v5 and setup-python to @v6 (Node.js-24 majors)."
            exit 1
          fi
          echo "All Action pins are on Node.js-24 majors."
